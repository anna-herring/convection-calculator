<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xe Saturation Volume Calculator</title>
<style>
  :root{--bg:#f5f6fa;--panel:#fff;--border:#dde1ea;--accent:#2c5f8a;--accent2:#3a7ebf;
        --text:#1e2530;--muted:#6b7280;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--radius:8px;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);padding:20px;}
  header{background:var(--accent);color:#fff;padding:13px 22px;border-radius:var(--radius);margin-bottom:20px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  header h1{font-size:1.1rem;font-weight:600;}
  header span{font-size:.8rem;opacity:.8;}
  header nav{margin-left:auto;display:flex;gap:14px;}
  header nav a{color:#fff;text-decoration:none;font-size:.84rem;opacity:.85;padding:3px 9px;border-radius:5px;}
  header nav a:hover{opacity:1;background:rgba(255,255,255,.15);}
  header nav a.cur{background:rgba(255,255,255,.22);opacity:1;font-weight:600;}
  .container{max-width:900px;margin:0 auto;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:15px;}
  .section-title{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:12px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
  @media(max-width:600px){.grid{grid-template-columns:1fr;}}
  label.field{display:flex;flex-direction:column;gap:3px;font-size:.8rem;margin-bottom:12px;}
  label.field .hint{color:var(--muted);font-size:.71rem;}
  input[type=number]{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:5px;font-size:.85rem;background:var(--bg);color:var(--text);}
  input[type=number]:focus{outline:2px solid var(--accent2);border-color:transparent;}
  button{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:.88rem;font-weight:600;cursor:pointer;}
  button:hover{background:var(--accent2);}
  button:disabled{background:#9ca3af;cursor:not-allowed;}
  .results{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px;}
  .result-card{background:#f1f5f9;border:1px solid var(--border);border-radius:var(--radius);padding:12px;}
  .result-card .k{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:3px;}
  .result-card .v{font-size:1.2rem;font-weight:600;color:var(--accent);}
  .result-card .s{font-size:.7rem;color:var(--muted);margin-top:3px;}
  .note{background:#fffbeb;border:1px solid #fde68a;border-radius:var(--radius);padding:10px 13px;font-size:.76rem;line-height:1.55;color:#78350f;margin-top:15px;}
  .note.bad{background:#fef2f2;border-color:#fecaca;color:#7f1d1d;}
  .note.ok{background:#f0fdf4;border-color:#bbf7d0;color:#14532d;}
  #err{font-size:.75rem;color:var(--bad);min-height:14px;margin-top:10px;}
</style>
</head>
<body>
<header>
  <h1>Xe Saturation Volume Calculator</h1>
  <span>How much Xe gas do you need?</span>
  <nav><a href="/">Dashboard</a><a href="/saturation.html" class="cur">Saturation</a><a href="/theory.html">Equations</a></nav>
</header>

<div class="container">
  <div class="card">
    <div class="section-title">Tank (Xe gas source)</div>
    <div class="grid">
      <label class="field">Pressure
        <input type="number" id="P_tank" value="130" step="5" min="5" max="1500">
        <span class="hint">PSI</span></label>
      <label class="field">Temperature
        <input type="number" id="T_tank" value="20" step="1" min="1" max="90">
        <span class="hint">°C</span></label>
    </div>
  </div>

  <div class="card">
    <div class="section-title">Target (pore water saturation)</div>
    <div class="grid">
      <label class="field">Pressure
        <input type="number" id="P_pore" value="10" step="0.5" min="0.5" max="60">
        <span class="hint">MPa</span></label>
      <label class="field">Temperature
        <input type="number" id="T_pore" value="40" step="1" min="1" max="90">
        <span class="hint">°C</span></label>
      <label class="field">Water volume
        <input type="number" id="V_water" value="7" step="0.1" min="0.1" max="100000">
        <span class="hint">ml</span></label>
    </div>
  </div>

  <div class="card">
    <button onclick="run()">Calculate Xe Volume</button>
    <div id="err"></div>
  </div>

  <div class="card" id="results-card" style="display:none;">
    <div class="section-title">Results</div>
    <div class="results">
      <div class="result-card">
        <div class="k">Xe volume at tank</div>
        <div class="v"><span id="V_xe_tank">—</span> ml</div>
        <div class="s">at <span id="P_tank_label">130</span> PSI / <span id="T_tank_label">20</span>°C</div>
      </div>
      <div class="result-card">
        <div class="k">Saturation mole fraction</div>
        <div class="v"><span id="x_sat">—</span></div>
        <div class="s">at pore conditions</div>
      </div>
      <div class="result-card">
        <div class="k">Moles Xe dissolved</div>
        <div class="v"><span id="n_xe">—</span></div>
        <div class="s">at saturation</div>
      </div>
      <div class="result-card">
        <div class="k">Xe density at tank</div>
        <div class="v"><span id="rho_xe">—</span></div>
        <div class="s">kg/m³</div>
      </div>
    </div>
    <div id="hydrate-note"></div>
  </div>
</div>

<script>
const gv = id => +document.getElementById(id).value;

async function run(){
  const errDiv = document.getElementById('err');
  errDiv.innerText = '';

  try {
    // Convert PSI to MPa (1 PSI = 0.00689476 MPa)
    const P_tank_PSI = gv('P_tank');
    const P_tank_MPa = P_tank_PSI * 0.00689476;

    // Convert ml to L (1 ml = 0.001 L)
    const V_water_ml = gv('V_water');
    const V_water_L = V_water_ml * 0.001;

    const req = {
      P_tank_MPa: P_tank_MPa,
      T_tank_C: gv('T_tank'),
      P_pore_MPa: gv('P_pore'),
      T_pore_C: gv('T_pore'),
      V_water_L: V_water_L,
    };

    const r = await (await fetch('/api/saturation', {
      method: 'POST',
      body: JSON.stringify(req),
      headers: {'Content-Type': 'application/json'}
    })).json();

    if (r.detail){
      errDiv.innerText = r.detail;
      return;
    }

    // Update results
    document.getElementById('V_xe_tank').innerText = (r.V_xe_tank_L * 1000).toFixed(1);
    document.getElementById('x_sat').innerText = (r.x_sat*1000).toFixed(1) + ' mmol/mol';
    document.getElementById('n_xe').innerText = r.n_xe_dissolved.toFixed(3);
    document.getElementById('rho_xe').innerText = r.rho_xe_tank.toFixed(1);

    document.getElementById('P_tank_label').innerText = P_tank_PSI.toFixed(0);
    document.getElementById('T_tank_label').innerText = req.T_tank_C.toFixed(0);

    // Hydrate warnings
    const hydNote = document.getElementById('hydrate-note');
    if (r.warning){
      hydNote.className = 'note bad';
      hydNote.innerHTML = '<strong>Hydrate warning:</strong> ' + r.warning;
    } else {
      hydNote.className = 'note ok';
      hydNote.innerHTML = '<strong>Hydrate-free.</strong> Tank: ~' + r.P_hydrate_tank_MPa.toFixed(2) +
                          ' MPa bound at ' + req.T_tank_C.toFixed(0) + '°C; Pore: ~' +
                          r.P_hydrate_pore_MPa.toFixed(2) + ' MPa at ' + req.T_pore_C.toFixed(0) + '°C.';
    }

    document.getElementById('results-card').style.display = 'block';
  } catch (e){
    errDiv.innerText = 'Error: ' + e.message;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  // Auto-calculate on load
  run();
});
</script>
</body>
</html>
